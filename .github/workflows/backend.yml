name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'src/Backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/Backend/**'
      - '.github/workflows/backend.yml'

permissions:
  contents: read
  id-token: write

defaults:
  run:
    working-directory: src/Backend

jobs:
  ci:
    name: CI (formatação e testes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/Backend/package-lock.json

      - run: npm ci

      - name: Formatação (Prettier)
        run: npm run format:check

      - name: Sobe API, MySQL e emulador do Secret Manager
        run: docker compose up -d --build

      - name: Testes
        run: npm test

      - name: Logs da API (só aparece se algo falhou)
        if: failure()
        run: docker compose logs api

      - name: Derruba os containers
        if: always()
        run: docker compose down -v

  cd:
    name: Deploy no Cloud Run
    needs: ci
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    env:
      SERVICE_NAME: trocaticket-event-planning-api
      GCP_PROJECT_ID: davi-varella-labs-prod
      GCP_REGION: us-central1
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_EMAIL }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: |
          URL=$(gcloud run deploy "$SERVICE_NAME" \
            --source . \
            --region "$GCP_REGION" \
            --project "$GCP_PROJECT_ID" \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 3 \
            --memory 512Mi \
            --service-account "${{ vars.API_SERVICE_ACCOUNT }}" \
            --set-env-vars "^@^APP_ENV=production@SERVICE_NAME=$SERVICE_NAME@GCP_PROJECT_ID=$GCP_PROJECT_ID@DB_NAME=event_planning@DB_CREDENTIALS_SECRET_NAME=trocaticket-event-planning-db-credentials@JWT_SECRET_NAME=trocaticket-event-planning-jwt-secret@CORS_ALLOWED_ORIGINS=${{ vars.CORS_ALLOWED_ORIGINS }}@GIT_COMMIT=${{ github.sha }}@GIT_BRANCH=${{ github.ref_name }}" \
            --format='value(status.url)')
          echo "### API no ar: $URL/event_planning/" >> $GITHUB_STEP_SUMMARY
