<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="x-apple-disable-message-reformatting" />
    <title>TrocaTicket</title>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: #0f172a; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color: #f1f5f9; padding: 40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; background-color: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);">
            <!-- Barra superior com gradiente da marca -->
            <tr>
              <td style="height: 4px; background: linear-gradient(90deg, #0a50ae 0%, #fe7524 100%); font-size: 0; line-height: 0;">&nbsp;</td>
            </tr>

            <!-- Cabeçalho com o Logotipo oficial -->
            <tr>
              <td style="padding: 28px 36px 20px; border-bottom: 1px solid #f1f5f9;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td align="left" style="vertical-align: middle;">
                      <img src="data:image/png;base64,{{logo}}" alt="TrocaTicket" width="148" style="display: block; border: 0; outline: none; width: 148px; max-width: 148px; height: auto;" />
                    </td>
                    <td align="right" style="vertical-align: middle;">
                      <span style="display: inline-block; padding: 4px 10px; background-color: #eff6ff; color: #0a50ae; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.6px; border-radius: 20px;">Gestão</span>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Conteúdo Principal -->
            <tr>
              <td style="padding: 32px 36px 36px; font-size: 15px; line-height: 1.6; color: #1e293b;">
                {{conteudo}}
              </td>
            </tr>

            <!-- Rodapé do Card -->
            <tr>
              <td style="padding: 20px 36px; background-color: #f8fafc; border-top: 1px solid #f1f5f9; font-size: 12px; color: #64748b; line-height: 1.5; text-align: center;">
                <p style="margin: 0 0 4px; font-weight: 600; color: #475569;">TrocaTicket · {{ano}}</p>
                <p style="margin: 0; color: #94a3b8;">Este é um e-mail automático. Por favor, não responda a esta mensagem.</p>
              </td>
            </tr>
          </table>

          <!-- Rodapé externo -->
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width: 560px; margin-top: 16px;">
            <tr>
              <td align="center" style="font-size: 11px; color: #94a3b8; line-height: 1.4;">
                © {{ano}} TrocaTicket. Todos os direitos reservados.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
