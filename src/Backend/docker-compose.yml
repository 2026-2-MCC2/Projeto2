services:
  api:
    build: .
    ports:
      - '${API_PORT:-3300}:3300'
    env_file: local.env
    environment:
      SECRET_MANAGER_EMULATOR_HOST: secret-manager:9090
    volumes:
      - ./src:/app/src
    command: node --watch src/server.js
    depends_on:
      db:
        condition: service_healthy
      secret-manager:
        condition: service_started

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root_pwd
      MYSQL_DATABASE: event_planning
      MYSQL_USER: my_user
      MYSQL_PASSWORD: my_pwd
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - ./database/database.sql:/docker-entrypoint-initdb.d/01.sql:ro
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-u', 'my_user', '-pmy_pwd']
      interval: 2s
      retries: 60

  secret-manager:
    image: ghcr.io/blackwell-systems/gcp-secret-manager-emulator-dual:1.9.0
    ports:
      - '${SECRET_MANAGER_PORT:-9090}:9090'
